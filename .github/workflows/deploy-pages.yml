# Xenon3 — automatic GitHub Pages deployment
#
# How it works: whenever `xenon3.zip` lands at the repository root, this
# workflow unpacks it and publishes the ready-made `site/` folder to
# GitHub Pages. Everything can be done from a browser — no PC required.
#
# One-time setup (see GITHUB-SETUP.md for the full walkthrough):
#   1. Upload xenon3.zip to the repository root (Add file → Upload files).
#   2. Add this file as .github/workflows/deploy-pages.yml.
#   3. Settings → Pages → Source: choose "GitHub Actions".
# The game then goes live at https://<your-username>.github.io/<repo-name>/
# (asset paths are relative, so any repository name works).

name: Deploy Xenon3 to GitHub Pages

on:
  push:
    paths:
      - 'xenon3.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the game
        run: |
          test -f xenon3.zip
          rm -rf unpacked site
          mkdir -p unpacked
          unzip -q xenon3.zip -d unpacked
          test -d unpacked/xenon3/site
          cp -r unpacked/xenon3/site site
          # Make sure GitHub never runs Jekyll over _next/ assets.
          touch site/.nojekyll
          test -f site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
